<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Order</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='admin_add.css') }}"
    >
</head>

<body>

<main class="admin-page">
 <div class="admin-header">
  <h1>Add New Order</h1>
  <p>Create a new customer order</p>
   <a href="/admin/orders">View Orders</a>
   <button id="logout-btn" class="logout-btn" style="margin-left: 10px; padding: 5px 10px; background-color: #f04e23; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
 </div>

  <section class="add-order">
  <h2>New Order</h2>
  <form id="admin-add-order-form">
    <label for="customer_name">  Customer </label>
<input
    type="text"
     id="customer_name"
     name="customer"
      placeholder="Enter customer name"
        required >

 <label for="order_items">Food Item</label>
  <input
     type="text" id="order_items"
 name="items"  placeholder="Enter food item"
  required >
  <label for="order_quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="order_quantity"
                    name="quantity"
                    min="1"
                    placeholder="Enter quantity"
                    required
                >


                <label for="total_price">
                    Total Price
                </label>

                <input
                    type="number"
                    id="total_price"
                    name="total_price"
                    min="0"
                    step="0.01"
                    placeholder="Enter total price"
                    required
                >


                <button type="submit">
                    Add Order
                </button>

            </form>

        </section>

    </main>

    <script src="{{ url_for('static', filename='admin.js') }}"></script>

</body>
</html>
